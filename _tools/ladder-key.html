<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ladder climb (green screen) → WebP</title></head>
<body>
<pre id="log"></pre>
<canvas id="peek" width="300" height="720" style="background:#456"></canvas>
<script>
/* Dev tool (not part of the lomda): "סרטון אדם מטפס על סולם.mp4" (_src/ladder-climb.mp4, 1280×720, 25fps, green screen)
   → the values-ladder climber in full colour with soft edges. Every frame is cropped to the ladder, the green keyed out
   (soft alpha from how much greener than red/blue a pixel is, plus despill on the edges) and encoded as WebP with alpha.
   Output (PUT to /_out/): lclimb-0..4.webp – the rest positions; lclimb-seg1..4.webp – the climbs between them, played once. */
const log = m => (document.getElementById("log").textContent += m + "\n");
const fourcc = s => [...s].map(c => c.charCodeAt(0));
const u24 = v => [v & 255, (v >> 8) & 255, (v >> 16) & 255];
const u32 = v => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255];
function chunk(tag, data) { const out = new Uint8Array(8 + data.length + (data.length & 1)); out.set(fourcc(tag), 0); out.set(u32(data.length), 4); out.set(data, 8); return out; }
function concat(parts) { const n = parts.reduce((s, p) => s + p.length, 0), out = new Uint8Array(n); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out; }
function frameChunks(buf) {
  const b = new Uint8Array(buf), parts = [];
  for (let o = 12; o + 8 <= b.length;) {
    const tag = String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]);
    const size = b[o + 4] | (b[o + 5] << 8) | (b[o + 6] << 16) | (b[o + 7] << 24), total = 8 + size + (size & 1);
    if (tag === "ALPH" || tag === "VP8 " || tag === "VP8L") parts.push(b.slice(o, o + total));
    o += total;
  }
  return concat(parts);
}
const CROP = { x: 496, y: 0, w: 300, h: 720 }, FPS = 25, CUTS = [0, 42, 66, 93, 125];   // the frames where Adam rests
const K0 = 22, K1 = 60;            // greenness (G − max(R,B)): ≤ K0 opaque, ≥ K1 transparent, soft in between
function key(g) {
  const { w: W, h: H } = CROP, id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], gg = d[i + 1], b = d[i + 2], m = Math.max(r, b), gr = gg - m;
    const a = gr <= K0 ? 1 : gr >= K1 ? 0 : 1 - (gr - K0) / (K1 - K0);
    if (gg > m) d[i + 1] = m;                                            // despill: no pixel greener than its red/blue
    d[i + 3] = Math.round(255 * a);
  }
  g.putImageData(id, 0, 0);
}
async function run(quality = 0.9) {
  const blob = await (await fetch("/_src/ladder-climb.mp4", { cache: "no-store" })).blob();
  const v = document.createElement("video"); v.muted = true; v.src = URL.createObjectURL(blob);
  await new Promise(r => v.addEventListener("loadeddata", r, { once: true }));
  const cv = new OffscreenCanvas(CROP.w, CROP.h), g = cv.getContext("2d", { willReadFrequently: true });
  const peek = document.getElementById("peek").getContext("2d");
  const frames = [], dur = 1000 / FPS;
  for (let i = 0; i <= CUTS[CUTS.length - 1]; i++) {
    await new Promise(r => { v.onseeked = r; v.currentTime = Math.min(v.duration - 0.001, (i + 0.5) / FPS); });
    g.clearRect(0, 0, CROP.w, CROP.h); g.drawImage(v, CROP.x, CROP.y, CROP.w, CROP.h, 0, 0, CROP.w, CROP.h);
    key(g);
    peek.clearRect(0, 0, CROP.w, CROP.h); peek.drawImage(cv, 0, 0);
    frames.push(frameChunks(await (await cv.convertToBlob({ type: "image/webp", quality })).arrayBuffer()));
    const k = CUTS.indexOf(i);
    if (k >= 0) { const r = await fetch(`/_out/lclimb-${k}.webp`, { method: "PUT", body: await cv.convertToBlob({ type: "image/webp", quality: .95 }) }); log(`lclimb-${k}.webp (${r.status})`); }
  }
  for (let k = 1; k < CUTS.length; k++) {
    const fr = frames.slice(CUTS[k - 1], CUTS[k] + 1);
    const anmf = fr.map(f => chunk("ANMF", concat([new Uint8Array([...u24(0), ...u24(0), ...u24(CROP.w - 1), ...u24(CROP.h - 1), ...u24(dur), 0x02]), f])));
    const vp8x = chunk("VP8X", new Uint8Array([0x12, 0, 0, 0, ...u24(CROP.w - 1), ...u24(CROP.h - 1)]));
    const anim = chunk("ANIM", new Uint8Array([0, 0, 0, 0, 1, 0]));                 // loop count 1: played once
    const body = concat([new Uint8Array(fourcc("WEBP")), vp8x, anim, ...anmf]);
    const file = concat([new Uint8Array(fourcc("RIFF")), new Uint8Array(u32(body.length)), body]);
    const r = await fetch(`/_out/lclimb-seg${k}.webp`, { method: "PUT", body: file });
    log(`lclimb-seg${k}.webp ${fr.length} frames ${fr.length * dur}ms ${(file.length / 1024).toFixed(0)}KB (${r.status})`);
  }
  document.title = "DONE";
}
window.addEventListener("load", run);
</script>
</body></html>
