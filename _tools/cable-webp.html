<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>cable crossover (green screen) → WebP</title></head>
<body>
<pre id="log"></pre>
<canvas id="peek" width="444" height="352" style="background:#456"></canvas>
<script>
/* Dev tool (not part of the lomda): the pulley drill's Aya – the green-screen videos behind "משיכה יד ימין/שמאל.gif"
   (_src/cable-4891.mp4, 1280×720, 25fps; the GIFs were only 256 colours, so they looked pixelated). Every frame is cropped
   to the machine, the green keyed out (soft alpha from how much greener than red/blue a pixel is, plus despill) and encoded
   as WebP with alpha. She pulls the strap on the screen's left, so the right-note animation is the same film mirrored.
   Output (PUT to /_out/): aya-cable-l.webp, aya-cable-r.webp (looping), aya-cable-still.webp (frame 0, the rest pose). */
const log = m => (document.getElementById("log").textContent += m + "\n");
const fourcc = s => [...s].map(c => c.charCodeAt(0));
const u24 = v => [v & 255, (v >> 8) & 255, (v >> 16) & 255];
const u32 = v => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255];
function chunk(tag, data) { const out = new Uint8Array(8 + data.length + (data.length & 1)); out.set(fourcc(tag), 0); out.set(u32(data.length), 4); out.set(data, 8); return out; }
function concat(parts) { const n = parts.reduce((s, p) => s + p.length, 0), out = new Uint8Array(n); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out; }
function frameChunks(buf) {
  const b = new Uint8Array(buf), parts = [];
  for (let o = 12; o + 8 <= b.length;) {
    const tag = String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]);
    const size = b[o + 4] | (b[o + 5] << 8) | (b[o + 6] << 16) | (b[o + 7] << 24), total = 8 + size + (size & 1);
    if (tag === "ALPH" || tag === "VP8 " || tag === "VP8L") parts.push(b.slice(o, o + total));
    o += total;
  }
  return concat(parts);
}
const CROP = { x: 196, y: 6, w: 888, h: 704 }, FPS = 25;   // the machine with a margin
const K0 = 50, K1 = 150;           // greenness (G − max(R,B)): ≤ K0 opaque, ≥ K1 transparent, soft in between (wide, so the thin cables survive)
function key(g) {
  const { w: W, h: H } = CROP, id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], gg = d[i + 1], b = d[i + 2], m = Math.max(r, b), gr = gg - m;
    const a = gr <= K0 ? 1 : gr >= K1 ? 0 : 1 - (gr - K0) / (K1 - K0);
    if (gg > m) d[i + 1] = m;                                            // despill: no pixel greener than its red/blue
    d[i + 3] = Math.round(255 * a);
  }
  g.putImageData(id, 0, 0);
}
const animWebp = (frames, W, H) => {
  const vp8x = chunk("VP8X", new Uint8Array([0x12, 0, 0, 0, ...u24(W - 1), ...u24(H - 1)]));
  const anim = chunk("ANIM", new Uint8Array([0, 0, 0, 0, 0, 0]));                 // loop forever
  const body = concat([new Uint8Array(fourcc("WEBP")), vp8x, anim, ...frames]);
  return concat([new Uint8Array(fourcc("RIFF")), new Uint8Array(u32(body.length)), body]);
};
async function run(quality = 0.92) {
  const blob = await (await fetch("/_src/cable-4891.mp4", { cache: "no-store" })).blob();
  const v = document.createElement("video"); v.muted = true; v.src = URL.createObjectURL(blob);
  await new Promise(r => v.addEventListener("loadeddata", r, { once: true }));
  const { w: W, h: H } = CROP, n = Math.round(v.duration * FPS), dur = 1000 / FPS;
  const cv = new OffscreenCanvas(W, H), g = cv.getContext("2d", { willReadFrequently: true });
  const mv = new OffscreenCanvas(W, H), mg = mv.getContext("2d");
  const peek = document.getElementById("peek").getContext("2d");
  const L = [], R = [];
  const anmf = async c => chunk("ANMF", concat([new Uint8Array([...u24(0), ...u24(0), ...u24(W - 1), ...u24(H - 1), ...u24(dur), 0x02]), frameChunks(await (await c.convertToBlob({ type: "image/webp", quality })).arrayBuffer())]));
  for (let i = 0; i < n; i++) {
    await new Promise(r => { v.onseeked = r; v.currentTime = Math.min(v.duration - 0.001, (i + 0.5) / FPS); });
    g.clearRect(0, 0, W, H); g.drawImage(v, CROP.x, CROP.y, W, H, 0, 0, W, H); key(g);
    mg.setTransform(1, 0, 0, 1, 0, 0); mg.clearRect(0, 0, W, H); mg.setTransform(-1, 0, 0, 1, W, 0); mg.drawImage(cv, 0, 0);
    peek.clearRect(0, 0, 444, 352); peek.drawImage(cv, 0, 0, 444, 352);
    if (i === 0) { const r = await fetch("/_out/aya-cable-still.webp", { method: "PUT", body: await cv.convertToBlob({ type: "image/webp", quality: .95 }) }); log(`aya-cable-still.webp (${r.status})`); }
    L.push(await anmf(cv)); R.push(await anmf(mv));
  }
  for (const [name, fr] of [["aya-cable-l", L], ["aya-cable-r", R]]) {
    const file = animWebp(fr, W, H), r = await fetch(`/_out/${name}.webp`, { method: "PUT", body: file });
    log(`${name}.webp ${fr.length} frames ${(file.length / 1048576).toFixed(1)}MB (${r.status})`);
  }
  document.title = "DONE";
}
window.addEventListener("load", () => run());
</script>
</body></html>
